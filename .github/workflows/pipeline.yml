name: Hourly Data Pipeline Sync

on:
  schedule:
    - cron: '0 * * * *'  
  workflow_dispatch:      

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline script
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          python scripts/senate_pipeline.py
          python scripts/clean_transform.py

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dashboard data [skip ci]" && git push)